<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="halo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0abfc"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- 圆角方形背景 -->
  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#bg)"/>

  <!-- 书本卡片（正文） -->
  <rect x="132" y="122" width="244" height="248" rx="30" fill="#ffffff"/>

  <!-- 文字行 -->
  <g stroke="#d9ccf7" stroke-width="15" stroke-linecap="round">
    <line x1="168" y1="196" x2="352" y2="196"/>
    <line x1="168" y1="312" x2="330" y2="312"/>
  </g>

  <!-- 高亮的学习中单词（第二行被选中块） -->
  <g>
    <rect x="196" y="238" width="120" height="40" rx="20" fill="url(#halo)"/>
    <g stroke="#7c3aed" stroke-width="9" stroke-linecap="round">
      <line x1="226" y1="252" x2="226" y2="264"/>
      <line x1="246" y1="252" x2="246" y2="264"/>
      <line x1="266" y1="252" x2="266" y2="264"/>
      <line x1="286" y1="252" x2="286" y2="264"/>
    </g>
  </g>

  <!-- 放大镜：查看单词释义 -->
  <g>
    <line x1="362" y1="206" x2="404" y2="258" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
    <circle cx="336" cy="168" r="44" fill="rgba(255,255,255,.95)"/>
    <circle cx="336" cy="168" r="26" fill="#a855f7"/>
  </g>
</svg>